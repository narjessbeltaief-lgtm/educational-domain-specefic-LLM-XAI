<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Test Generator - On-Demand Question Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Welcome Screen */
        .welcome-section {
            text-align: center;
        }

        .welcome-section h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin: 15px 0;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            text-align: left;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        /* Test Screen */
        .test-header {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-header-info h3 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .test-header-info p {
            color: #666;
            font-size: 0.9em;
        }

        .progress-bar {
            width: 200px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .question-section {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.2em;
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-option:hover {
            border-color: #667eea;
            background: #f0f7ff;
        }

        .choice-option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .choice-option label {
            cursor: pointer;
            flex: 1;
            margin: 0;
        }

        .question-counter {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        /* Results Screen */
        .results-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }

        .score-card .score-value {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .score-card .score-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .results-table th,
        .results-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .results-table th {
            background: #f0f0f0;
            font-weight: 600;
            color: #333;
        }

        .results-table .correct {
            color: #4CAF50;
            font-weight: 600;
        }

        .results-table .incorrect {
            color: #f44336;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            border-left: 4px solid #f44336;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            border-left: 4px solid #4CAF50;
        }

        .feedback {
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: 600;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4CAF50;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .student-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .student-info label {
            font-weight: 600;
            color: #555;
            display: block;
            margin-bottom: 8px;
        }

        .student-info input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            width: 100%;
            font-size: 1em;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-row button {
            flex: 1;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .test-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .score-card .score-value {
                font-size: 2em;
            }

            .results-table {
                font-size: 0.9em;
            }

            .results-table th,
            .results-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Course Test Generator</h1>
            <p>Upload a course topic, generate tests, and score student answers.</p>
        </div>

        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="screen active">
            <div class="card">
                <div class="welcome-section">
                    <h2>Start a New Test</h2>
                    
                    <div class="student-info">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName" placeholder="e.g., John Doe">
                    </div>

                    <div class="input-group">
                        <label for="courseText">Course Material (paste text) — or upload a PDF below instead</label>
                        <textarea id="courseText" rows="8" placeholder="Paste course text here, or a chapter summary"></textarea>
                    </div>

                    <div class="input-group">
                        <label for="coursePdf">…or upload a course PDF</label>
                        <input type="file" id="coursePdf" accept="application/pdf" onchange="onPdfSelected()">
                        <div id="pdfFileName" style="font-size:0.85rem; color:#555; margin-top:4px;"></div>
                    </div>

                    <div class="input-group">
                        <label for="numQuestions">Number of Questions</label>
                        <input type="number" id="numQuestions" value="10" min="5" max="50">
                    </div>

                    <div class="input-group">
                        <label for="mcqRatio">MCQ Ratio (0.0 - 1.0)</label>
                        <input type="number" id="mcqRatio" value="0.5" min="0" max="1" step="0.1">
                    </div>

                    <div class="button-group">
                        <button class="btn-primary" onclick="startTest()">🚀 Generate Test</button>
                        <button class="btn-secondary" onclick="showViewResults()">📊 View Previous Results</button>
                    </div>

                    <div id="welcomeError"></div>
                </div>
            </div>
        </div>

        <!-- Test Screen -->
        <div id="testScreen" class="screen">
            <div class="card">
                <div class="test-header">
                    <div class="test-header-info">
                        <h3 id="testTopic"></h3>
                        <p id="studentDisplay"></p>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 0.9em; color: #666; margin-bottom: 8px;" id="progressText"></div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div id="testContent"></div>

                <div class="button-row">
                    <button class="btn-danger" onclick="cancelTest()">❌ Cancel Test</button>
                    <button class="btn-success" id="submitBtn" onclick="submitAnswer()" style="display: none;">✓ Next Question</button>
                    <button class="btn-success" id="finishBtn" onclick="submitAnswer()" style="display: none;">🏁 Finish Test</button>
                </div>

                <div id="testError"></div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <div class="card">
                <div class="results-section">
                    <h2>Test Complete! 🎉</h2>
                    
                    <div class="score-card">
                        <div class="score-label">Final Score</div>
                        <div class="score-value" id="finalScore">0%</div>
                        <div class="score-label" id="scoreDetails"></div>
                    </div>

                    <h3 style="color: #333; margin: 30px 0 20px 0;">Answer Breakdown</h3>
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Question #</th>
                                <th>Your Answer</th>
                                <th>Correct Answer</th>
                                <th>Result</th>
                                <th>Why</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                        </tbody>
                    </table>

                    <div class="button-row">
                        <button class="btn-secondary" onclick="showWelcome()">← Back to Home</button>
                        <button class="btn-primary" onclick="startNewTest()">🔄 Take Another Test</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/testing';
        let currentTest = null;
        let currentQuestion = 0;
        let answers = [];

        function onPdfSelected() {
            const fileInput = document.getElementById('coursePdf');
            const label = document.getElementById('pdfFileName');
            if (fileInput.files.length) {
                label.textContent = `Selected: ${fileInput.files[0].name} (will be used instead of pasted text)`;
            } else {
                label.textContent = '';
            }
        }

        async function startTest() {
            const studentName = document.getElementById('studentName').value.trim();
            const courseText = document.getElementById('courseText').value.trim();
            const pdfFile = document.getElementById('coursePdf').files[0];
            const numQuestions = parseInt(document.getElementById('numQuestions').value);
            const mcqRatio = parseFloat(document.getElementById('mcqRatio').value);
            const courseName = pdfFile
                ? (pdfFile.name.replace(/\.pdf$/i, '').trim() || 'Uploaded PDF Course')
                : 'Course Material';

            if (!studentName) {
                showError('welcomeError', 'Please enter your name');
                return;
            }

            if (!pdfFile && !courseText) {
                showError('welcomeError', 'Please paste course material or upload a course PDF');
                return;
            }

            showLoading('testContent');
            document.getElementById('testError').innerHTML = '';

            try {
                let response;
                if (pdfFile) {
                    // PDF upload path: extract + generate in one call.
                    const formData = new FormData();
                    formData.append('course_name', courseName);
                    formData.append('n_questions', numQuestions);
                    formData.append('mcq_ratio', mcqRatio);
                    formData.append('allow_open', 'false');
                    formData.append('file', pdfFile);

                    response = await fetch(`${API_URL}/generate-from-pdf`, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    response = await fetch(`${API_URL}/generate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            course_name: courseName,
                            course_text: courseText,
                            n_questions: numQuestions,
                            mcq_ratio: mcqRatio,
                            allow_open: false
                        })
                    });
                }

                if (!response.ok) {
                    const errBody = await response.json().catch(() => ({}));
                    throw new Error(errBody.detail || 'Failed to generate test');
                }

                const data = await response.json();
                currentTest = {
                    ...data,
                    studentName: studentName
                };
                answers = [];
                currentQuestion = 0;

                document.getElementById('testTopic').textContent = `Course: ${currentTest.course_name}`;
                document.getElementById('studentDisplay').textContent = `Student: ${currentTest.studentName}`;

                showScreen('testScreen');
                showQuestion();
            } catch (error) {
                showError('testError', `Error: ${error.message}`);
                showScreen('welcomeScreen');
            }
        }

        function showQuestion() {
            if (currentQuestion >= currentTest.questions.length) {
                return;
            }

            const question = currentTest.questions[currentQuestion];
            const total = currentTest.questions.length;
            const progressPercent = (currentQuestion / total) * 100;

            document.getElementById('progressBar').style.width = progressPercent + '%';
            document.getElementById('progressText').textContent = `${currentQuestion + 1} / ${total}`;

            let html = `<div class="question-counter">Question ${currentQuestion + 1} of ${total}</div>`;
            html += `<div class="question-text">${question.question}</div>`;

            if (question.choices && question.choices.length) {
                html += `<div class="choices">`;
                question.choices.forEach((choice, idx) => {
                    const id = `choice-${idx}`;
                    html += `
                        <div class="choice-option">
                            <input type="radio" id="${id}" name="answer" value="${choice}" onchange="updateSubmitButton()">
                            <label for="${id}">${choice}</label>
                        </div>
                    `;
                });
                html += `</div>`;
            } else {
                // Open-ended question: free-text answer, graded semantically server-side.
                html += `
                    <div class="choices">
                        <textarea id="openAnswer" rows="4" style="width:100%; font-family:inherit; font-size:1rem; padding:0.75rem; border-radius:8px; border:1px solid #ccc;"
                            placeholder="Type your answer here..." oninput="updateSubmitButton()"></textarea>
                    </div>
                `;
            }

            document.getElementById('testContent').innerHTML = html;

            document.getElementById('submitBtn').style.display = 'inline-block';
            document.getElementById('finishBtn').style.display = 'none';

            if (currentQuestion === total - 1) {
                document.getElementById('submitBtn').style.display = 'none';
                document.getElementById('finishBtn').style.display = 'inline-block';
            }

            updateSubmitButton();
        }

        function getCurrentAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (selected) return selected.value;
            const openField = document.getElementById('openAnswer');
            if (openField) return openField.value.trim();
            return null;
        }

        function updateSubmitButton() {
            const answer = getCurrentAnswer();
            const hasAnswer = !!(answer && answer.length);
            document.getElementById('submitBtn').disabled = !hasAnswer;
            document.getElementById('finishBtn').disabled = !hasAnswer;
        }

        async function submitAnswer() {
            const answer = getCurrentAnswer();
            if (!answer) return;
            showLoading('testContent');

            try {
                const response = await fetch(`${API_URL}/answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        test_id: currentTest.test_id,
                        student_name: currentTest.studentName,
                        question_num: currentQuestion + 1,
                        answer: answer
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to submit answer');
                }

                const feedback = await response.json();
                answers.push(feedback);
                currentQuestion++;

                setTimeout(() => {
                    if (currentQuestion < currentTest.questions.length) {
                        showQuestion();
                    } else {
                        finishTest();
                    }
                }, 300);
            } catch (error) {
                showError('testError', `Error: ${error.message}`);
            }
        }

        async function finishTest() {
            showLoading('testContent');

            try {
                const response = await fetch(
                    `${API_URL}/${currentTest.test_id}/results/${currentTest.studentName}`
                );

                if (!response.ok) {
                    throw new Error('Failed to get results');
                }

                const results = await response.json();
                displayResults(results);
                showScreen('resultsScreen');
            } catch (error) {
                showError('testError', `Error: ${error.message}`);
            }
        }

        function displayResults(results) {
            const percentage = results.percentage.toFixed(1);
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('scoreDetails').textContent = 
                `${results.total_score} / ${results.max_score} points`;

            let html = '';
            results.answers.forEach((ans, idx) => {
                const resultClass = ans.is_correct ? 'correct' : 'incorrect';
                const resultText = ans.is_correct ? '✓ Correct' : '✗ Incorrect';
                html += `
                    <tr>
                        <td>#${ans.question_num}</td>
                        <td>${ans.student_answer || 'Not answered'}</td>
                        <td>${ans.correct_answer}</td>
                        <td class="${resultClass}">${resultText}</td>
                        <td style="font-size:0.85rem; color:#555; max-width:260px;">${ans.justification || ''}</td>
                    </tr>
                `;
            });

            document.getElementById('resultsBody').innerHTML = html;
        }

        function cancelTest() {
            if (confirm('Are you sure? Your progress will be lost.')) {
                showWelcome();
            }
        }

        function startNewTest() {
            document.getElementById('studentName').value = currentTest.studentName;
            showWelcome();
        }

        function showWelcome() {
            showScreen('welcomeScreen');
            document.getElementById('welcomeError').innerHTML = '';
        }

        function showViewResults() {
            alert('View previous results feature coming soon!');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showLoading(elementId) {
            document.getElementById(elementId).innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            `;
        }

        function showError(elementId, message) {
            document.getElementById(elementId).innerHTML = `
                <div class="error-message">${message}</div>
            `;
        }
    </script>
</body>
</html>
